# python-semantic-release configuration ONLY. This file exists solely to drive
# `make release`; it is NOT part of the collection and is excluded from the
# Galaxy build artifact via build_ignore.
#
# How it works: python-semantic-release reads the Conventional Commits since the
# last tag (feat -> minor; fix/perf -> patch; feat!/BREAKING CHANGE -> major;
# this is the built-in "conventional" parser, the default), bumps the version in
# galaxy.yml, runs build_command, commits, tags (vX.Y.Z) and creates the GitHub
# release with commit-derived notes.
#
# The collection changelog (CHANGELOG.rst, changelogs/) is antsibull-changelog's:
# build_command cuts it for the version PSR has just written to galaxy.yml (the
# fragments become the release entry), stages the result and then builds the
# tarball; PSR commits the index, so the release commit, the tag and the
# tarball all carry the changelog. (PSR's `assets` option is not used for this:
# it also uploads each entry to the GitHub release as an attachment, and a
# directory entry aborts the release after the tag exists.) The Makefile runs
# `semantic-release version --no-changelog`, so PSR never writes a changelog of
# its own. The GitHub release notes still come from the commits.
#
# No token is configured here on purpose: PSR resolves it from the GH_TOKEN /
# GITHUB_TOKEN environment variable at runtime.
[tool.semantic_release]
version_variables = ["galaxy.yml:version"]
build_command = "antsibull-changelog release && git add CHANGELOG.rst changelogs && ansible-galaxy collection build --output-path dist/"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"

[tool.semantic_release.publish]
# Attach the built collection tarball to the GitHub release as an asset.
dist_glob_patterns = ["dist/*.tar.gz"]
upload_to_vcs_release = true
