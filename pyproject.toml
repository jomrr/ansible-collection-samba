# Development tooling; excluded from the Galaxy build via build_ignore.

# `make release`: bump galaxy.yml from the Conventional Commits, cut the
# antsibull changelog, build, commit, tag and create the GitHub release.
# The token comes from GH_TOKEN or GITHUB_TOKEN.
[tool.semantic_release]
version_variables = ["galaxy.yml:version"]
build_command = "antsibull-changelog release && git add CHANGELOG.rst changelogs && ansible-galaxy collection build --output-path dist/"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"

[tool.semantic_release.publish]
# Attach the built collection tarball to the GitHub release as an asset.
dist_glob_patterns = ["dist/*.tar.gz"]
upload_to_vcs_release = true

# Line limit of ansible-test's pep8 sanity test.
[tool.ruff]
line-length = 160

[tool.ruff.lint]
extend-select = ["E501"]

# Resolve ansible_collections.* from the directory that contains it.
[tool.mypy]
explicit_package_bases = true
follow_untyped_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../.."
