---
minor_changes:
  - >-
    samba_join_member, samba_join_sssd - new option C(force) to re-join a host
    that already has a machine account, re-establishing the machine password
    respectively the keytab (always a change; requires C(bind_password)).
bugfixes:
  - >-
    samba_join_member, samba_join_sssd - whether the host is joined is now
    decided locally (the machine account in the local Samba secrets store,
    respectively a machine principal for the realm in the keytab) instead of
    by C(net ads testjoin) / C(adcli testjoin). Those probes need a reachable
    DC found by DNS discovery, a working KDC and a sane clock, so any such
    failure looked like "not joined" and triggered an unintended re-join with
    a new machine password or keytab, and a plain DC outage produced a
    misleading "joining failed" and a wrong C(changed) in check mode. The
    C(net) binary is no longer required by samba_join_member.
