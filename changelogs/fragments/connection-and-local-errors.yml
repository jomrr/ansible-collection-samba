---
bugfixes:
  - >-
    all object and info modules (shared connection) - a failed connection now
    reports its cause instead of one generic message. The bind user and realm
    are named (they are not secrets; the password never appears). When the DC
    was reached but no Kerberos ticket could be obtained, the KDC's reason is
    given (wrong password, unreachable KDC, clock skew); when the ticket was
    fine, the LDAP bind error is given so a DC that refuses sealing can be
    told apart; when the DC was not reached at all, the transport error is
    given.
  - >-
    samba_provision, samba_join_dc - a local Samba database that exists but
    cannot be opened for lack of privileges is reported as a permission
    problem instead of as a partially provisioned or corrupt host, and the
    local domain's DNS name is taken from samba's own C(domain_dns_name())
    instead of being derived from the DN by hand.
