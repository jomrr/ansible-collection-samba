---
breaking_changes:
  - >-
    samba_group - C(scope) and C(category) no longer default to C(global) and
    C(security). When omitted, a new group is still created as a global
    security group, but the type of an existing group is left unchanged; when
    only one of the two is given, the other part is kept from the stored type.
    Previously every task reconciled the defaults, so updating for example the
    description of the built-in domain-local C(DnsAdmins) group tried to
    convert it to a global group and failed. Playbooks that relied on the
    defaults to enforce a type must set C(scope) and C(category) explicitly.
