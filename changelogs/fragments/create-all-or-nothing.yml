---
bugfixes:
  - >-
    samba_user, samba_group - creating an object is now all-or-nothing. LDAP
    offers no transactions, so when a step after the initial add failed (a
    failed move under C(path), an attribute, enabled-state, gidNumber or member
    write) a half-created object stayed behind. The module now removes the
    object it just created and fails with the cause. A create that samba's own
    create helper rejects (for example a password refused by the domain
    policy) is reported cleanly instead of as a traceback. Changes to an
    existing object remain separate operations that a re-run completes.
