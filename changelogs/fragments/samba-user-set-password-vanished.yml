---
bugfixes:
  - >-
    samba_user - with C(update_password=always), a user removed between the
    read and the password write ended in a traceback, because samba's
    C(setpassword) raises a plain exception for a missing user that the
    module's error-code handler never saw. The password is now written by DN
    (the same C(unicodePwd) encoding samba uses), so a vanished user and a
    password rejected by the domain policy are both reported as clear errors.
