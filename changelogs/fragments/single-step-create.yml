---
minor_changes:
  - >-
    samba_user, samba_group - a new object is added in a single operation.
    samba's own C(newuser)/C(newgroup) take the container (C(path)), the
    names, e-mail, description and the POSIX attributes (C(gid_number) for
    groups), so a create no longer adds, renames and modifies in turn. As with
    C(samba-tool user create), a user created with C(given_name) and/or
    C(surname) but no C(display_name) gets a display name derived from the
    names; check mode and the diff predict it.
