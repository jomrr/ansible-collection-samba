---
minor_changes:
  - >-
    New module samba_password_policy to manage the domain password policy
    (length, history, ages, lockout, complexity, reversible encryption) in a
    Samba AD DC; settings not given stay untouched, unrelated
    C(pwdProperties) bits are preserved.
  - >-
    New module samba_password_settings to manage fine-grained password
    settings objects (PSOs) and the exact set of users and global security
    groups they apply to; a new PSO inherits the settings not given from the
    domain policy, as C(samba-tool domain passwordsettings pso create) does.
