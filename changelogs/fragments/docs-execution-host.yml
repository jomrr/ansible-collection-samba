---
bugfixes:
  - >-
    samba_user, samba_user_info, samba_group, samba_group_info, samba_ou,
    samba_ou_info, samba_dns_record, samba_dns_record_info, samba_dns_zone,
    samba_dns_zone_info - the documentation no longer claims the module must
    run on the DC. These modules reach the DC over the network (GSSAPI
    sign+seal LDAP, plus the C(dnsserver) RPC for zones) and run on any host
    that has the C(samba) Python bindings and can reach the DC; the DC itself
    is merely the simplest place. The wording was left over from the
    credential-free local connection model the collection abandoned.
trivial:
  - galaxy.yml - the collection description now covers provisioning and
    joining as well as the object and DNS modules.
