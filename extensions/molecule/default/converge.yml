---
# Exercise all modules against the real DC. This playbook must be fully
# idempotent: molecule runs it twice and the second run must report no changes.
# Objects that are modified/disabled/deleted/purged/moved here were seeded in
# prepare.yml, so those transitions happen on the first run and are no-ops on
# the second.
#
# Deliberately NOT tested here: samba_user update_password=always. It is the one
# honestly non-idempotent path (the password cannot be read back, so the write
# is reported as a change every run). Molecule's idempotence stage re-runs this
# whole playbook and asserts zero changes with no per-task exclusion, so a task
# using update_password=always would (correctly) fail that stage. Its behaviour
# is covered by the unit tests instead; putting it here would mean weakening the
# idempotence invariant, which we do not do.
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    _password: "{{ samba_admin_password }}"
  module_defaults:
    # All jomrr.samba modules connect with the admin credentials via GSSAPI
    # sign+seal LDAP; set once here instead of on every task.
    group/jomrr.samba.all:
      server: "{{ samba_fqdn }}"
      bind_username: Administrator
      bind_password: "{{ samba_admin_password }}"
      realm: "{{ samba_realm }}"
  tasks:
    - name: Converge | Create a user with the common attributes
      jomrr.samba.samba_user:
        username: jane
        given_name: Jane
        surname: Doe
        display_name: Jane Doe
        email: jane.doe@example.com
        description: Integration test user
        enabled: true
        password: "{{ _password }}"
        state: present

    - name: Converge | Create a user with names only (samba derives the display name)
      jomrr.samba.samba_user:
        username: derived
        given_name: Dee
        surname: Rived
        password: "{{ _password }}"
        state: present

    - name: Converge | Change an attribute on an existing user
      jomrr.samba.samba_user:
        username: tomodify
        display_name: New Name
        state: present

    - name: Converge | Change several attributes on an existing user at once
      jomrr.samba.samba_user:
        username: multiattr
        given_name: Multi
        surname: User
        display_name: New Multi
        email: multi.user@example.com
        description: New multi description
        state: present

    - name: Converge | Remove attributes from an existing user (empty string)
      jomrr.samba.samba_user:
        username: clearattr
        display_name: ""
        description: ""
        state: present

    - name: Converge | Create a user with the full RFC2307/POSIX attribute set
      jomrr.samba.samba_user:
        username: posixuser
        password: "{{ _password }}"
        uid_number: 10001
        gid_number: 10000
        unix_home_directory: /home/posixuser
        login_shell: /bin/bash
        gecos: POSIX User
        state: present

    - name: Converge | Change single POSIX attributes on an existing user (int + string)
      jomrr.samba.samba_user:
        username: posixmod
        uid_number: 10002
        login_shell: /bin/zsh
        state: present

    - name: Converge | Disable an existing user
      jomrr.samba.samba_user:
        username: todisable
        enabled: false
        state: present

    - name: Converge | Re-enable a disabled user
      jomrr.samba.samba_user:
        username: toenable
        enabled: true
        state: present

    - name: Converge | Change an attribute on a disabled user without touching its state
      # enabled is unset, so the account must stay disabled (no implicit re-enable).
      jomrr.samba.samba_user:
        username: staydisabled
        display_name: New Disabled
        state: present

    - name: Converge | Remove a user
      jomrr.samba.samba_user:
        username: todelete
        state: absent

    - name: Converge | A computer account is never matched as a user (absent is a no-op)
      # The DC's own machine account is objectClass=user too. The module must
      # not see it, otherwise state=absent would delete the DC's account.
      jomrr.samba.samba_user:
        username: "{{ inventory_hostname | upper }}$"
        state: absent
      register: _computer_absent
      failed_when: _computer_absent.changed

    - name: Converge | A create rejected by the password policy leaves no account behind
      # samba's newuser adds the account, fails on the rejected password and
      # deletes the account again itself (_CleanUpOnError). The module must
      # fail cleanly - no traceback - and no account may remain, whether samba
      # or the module's compensation removed it (verify.yml checks).
      jomrr.samba.samba_user:
        username: weakpw
        given_name: Weak
        password: x
        state: present
      register: _weakpw
      failed_when: >-
        _weakpw is not failed
        or "creating user 'weakpw' failed" not in _weakpw.msg
        or 'check_password_restrictions' not in _weakpw.msg

    - name: Converge | Check mode fails like a real run when the target OU is missing
      # The parent probe runs before check mode reports anything, so a dry run
      # cannot claim "changed" for a create the real run would refuse.
      jomrr.samba.samba_user:
        username: ghostpath
        password: "{{ _password }}"
        path: "OU=nowhere,{{ samba_base_dn }}"
        state: present
      check_mode: true
      register: _ghostpath
      failed_when: _ghostpath is not failed or 'does not exist' not in _ghostpath.msg

    - name: Converge | Absent on a non-existent user is a no-op
      jomrr.samba.samba_user:
        username: ghost
        state: absent

    - name: Converge | Create a global security group with a member (additive)
      jomrr.samba.samba_group:
        name: engineers
        scope: global
        category: security
        description: Engineering team
        members:
          - jane
        state: present

    - name: Converge | Reduce a 3-member group to one authoritative member (purge)
      jomrr.samba.samba_group:
        name: crew
        members:
          - tomodify
        members_purge: true
        state: present

    - name: Converge | Add a member to a group that already has one (additive)
      jomrr.samba.samba_group:
        name: addmembers
        members:
          - jane
        state: present

    - name: Converge | Change a group's scope (global -> universal)
      jomrr.samba.samba_group:
        name: scopechange
        scope: universal
        category: security
        state: present

    - name: Converge | Update a built-in group's description without touching its type
      # DnsAdmins is domain-local. With scope and category unset the type must
      # stay; the old defaults would have tried to convert it to global.
      jomrr.samba.samba_group:
        name: DnsAdmins
        description: Managed by molecule
        state: present

    - name: Converge | Set the POSIX gid on an existing group
      jomrr.samba.samba_group:
        name: posixgrp
        gid_number: 10000
        state: present

    - name: Converge | Create a group with a POSIX gid directly in an OU (one add)
      jomrr.samba.samba_group:
        name: posixnew
        gid_number: 10001
        path: "OU=loc_a,{{ samba_base_dn }}"
        state: present

    - name: Converge | A group with unknown members fails naming every missing one, before any write
      jomrr.samba.samba_group:
        name: badmembers
        members:
          - jane
          - nosuchuser1
          - nosuchuser2
        state: present
      register: _badmembers
      failed_when: >-
        _badmembers is not failed
        or 'nosuchuser1' not in _badmembers.msg
        or 'nosuchuser2' not in _badmembers.msg

    # The read mirror: samba_group_info returns member DNs, samba_group takes
    # them back as members - authoritatively, and nothing may change.
    - name: Converge | Read a group's members back as DNs
      jomrr.samba.samba_group_info:
        name: engineers
      register: _engineers_read

    - name: Converge | Feeding the member DNs back into samba_group is a no-op (read mirror)
      jomrr.samba.samba_group:
        name: engineers
        members: "{{ _engineers_read.groups[0].members }}"
        members_purge: true
        state: present
      register: _mirror
      failed_when: _mirror is changed

    - name: Converge | Create a top-level OU
      jomrr.samba.samba_ou:
        name: department
        path: "{{ samba_base_dn }}"
        description: Department OU
        state: present

    - name: Converge | Create a nested OU (its parent was just created)
      jomrr.samba.samba_ou:
        name: team
        path: "OU=department,{{ samba_base_dn }}"
        state: present

    - name: Converge | Create a third-level nested OU (parents just created)
      jomrr.samba.samba_ou:
        name: squad
        path: "OU=team,OU=department,{{ samba_base_dn }}"
        state: present

    - name: Converge | Change an existing OU's description
      jomrr.samba.samba_ou:
        name: oldou
        path: "{{ samba_base_dn }}"
        description: New OU description
        state: present

    - name: Converge | Change a nested OU's description
      jomrr.samba.samba_ou:
        name: submod
        path: "OU=loc_a,{{ samba_base_dn }}"
        description: New nested description
        state: present

    - name: Converge | Remove an (empty) OU
      jomrr.samba.samba_ou:
        name: todelete_ou
        path: "{{ samba_base_dn }}"
        state: absent

    - name: Converge | Absent on a non-existent OU is a no-op
      jomrr.samba.samba_ou:
        name: ghostou
        path: "{{ samba_base_dn }}"
        state: absent

    - name: Converge | samba_ou_info rejects an invalid path cleanly (no traceback)
      jomrr.samba.samba_ou_info:
        path: not a dn
      register: _badpath
      failed_when: _badpath is not failed or 'not a valid distinguished name' not in _badpath.msg

    - name: Converge | A bare server name without realm is refused before any connection
      # module_defaults sets realm for the group; an empty value un-sets it here.
      jomrr.samba.samba_user_info:
        server: "{{ inventory_hostname }}"
        realm: ""
      register: _norealm
      failed_when: _norealm is not failed or 'realm is required' not in _norealm.msg

    - name: Converge | Create a user directly in an OU
      jomrr.samba.samba_user:
        username: placed
        password: "{{ _password }}"
        path: "OU=loc_a,{{ samba_base_dn }}"
        state: present

    - name: Converge | Move a user to another OU (idempotent move)
      jomrr.samba.samba_user:
        username: mover
        path: "OU=loc_b,{{ samba_base_dn }}"
        state: present

    - name: Converge | Move a user to another OU AND change an attribute at once
      # Exercises the documented create -> move -> attributes order: the
      # displayName write must land on the post-move DN.
      jomrr.samba.samba_user:
        username: moverattr
        display_name: New MoverAttr
        path: "OU=loc_b,{{ samba_base_dn }}"
        state: present

    - name: Converge | Create a group directly in an OU
      jomrr.samba.samba_group:
        name: gplaced
        path: "OU=loc_a,{{ samba_base_dn }}"
        state: present

    - name: Converge | Move a group to another OU (idempotent move)
      jomrr.samba.samba_group:
        name: gmover
        path: "OU=loc_b,{{ samba_base_dn }}"
        state: present

    - name: Converge | Remove a group's description (empty string)
      jomrr.samba.samba_group:
        name: gclear
        description: ""
        state: present

    - name: Converge | Remove an OU's description (empty string)
      jomrr.samba.samba_ou:
        name: ouclear
        path: "{{ samba_base_dn }}"
        description: ""
        state: present

    - name: Converge | Create a group with a member directly in an OU (path + members)
      jomrr.samba.samba_group:
        name: gstaff
        path: "OU=loc_a,{{ samba_base_dn }}"
        members:
          - jane
        state: present

    - name: Converge | Create an A record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: www
        type: A
        value: 192.0.2.10
        state: present

    - name: Converge | Create an AAAA record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: www
        type: AAAA
        value: 2001:db8::10
        state: present

    - name: Converge | Create a CNAME record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: ftp
        type: CNAME
        value: "www.{{ samba_dns_zone }}"
        state: present

    - name: Converge | Create an MX record at the apex
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: "@"
        type: MX
        value: "mail.{{ samba_dns_zone }}"
        preference: 10
        state: present

    - name: Converge | Create a TXT record at the apex
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: "@"
        type: TXT
        value: "v=spf1 -all"
        state: present

    - name: Converge | Create an SRV record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: _sip._tcp
        type: SRV
        value: "sip.{{ samba_dns_zone }}"
        priority: 0
        weight: 100
        port: 5060
        state: present

    - name: Converge | Create a PTR record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: ptrtest
        type: PTR
        value: "host.{{ samba_dns_zone }}"
        state: present

    - name: Converge | Create an NS delegation record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: deleg
        type: NS
        value: "ns1.{{ samba_dns_zone }}"
        state: present

    - name: Converge | Change only the TTL of a seeded record (reconciled in place)
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: dnsttl
        type: A
        value: 192.0.2.96
        ttl: 600
        state: present

    - name: Converge | Re-create a name samba-tool deleted (node tombstoned by the RPC)
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: dnsrevive
        type: A
        value: 192.0.2.97
        state: present

    - name: Converge | Remove a seeded DNS record
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: dnsdel
        type: A
        value: 192.0.2.99
        state: absent

    - name: Converge | Re-create a record at the removed name
      # Removing the last record of a name leaves a tombstoned dnsNode behind
      # (samba never deletes the node). Adding at that name must revive the
      # node, otherwise the DNS server keeps ignoring it; verify.yml resolves it.
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: dnsdel
        type: A
        value: 192.0.2.98
        state: present

    - name: Converge | Absent on a non-existent DNS record is a no-op
      jomrr.samba.samba_dns_record:
        zone: "{{ samba_dns_zone }}"
        name: ghostdns
        type: A
        value: 192.0.2.200
        state: absent

    - name: Converge | Create a forward DNS zone
      jomrr.samba.samba_dns_zone:
        name: ztest.example.com
        state: present

    - name: Converge | Create a reverse DNS zone
      jomrr.samba.samba_dns_zone:
        name: 2.0.192.in-addr.arpa
        state: present

    - name: Converge | Create a forest-replicated DNS zone
      jomrr.samba.samba_dns_zone:
        name: zforest.example.com
        replication: forest
        state: present

    - name: Converge | Remove a seeded DNS zone (and its records)
      jomrr.samba.samba_dns_zone:
        name: zdelete.example.com
        state: absent

    - name: Converge | Absent on a non-existent DNS zone is a no-op
      jomrr.samba.samba_dns_zone:
        name: zghost.example.com
        state: absent

    - name: Converge | Create a DNS zone with record aging and both intervals
      jomrr.samba.samba_dns_zone:
        name: zaging.example.com
        aging: true
        norefresh_interval: 72
        refresh_interval: 96
        state: present

    - name: Converge | Turn aging off on a seeded zone and leave its intervals alone
      jomrr.samba.samba_dns_zone:
        name: zseedaging.example.com
        aging: false
        state: present

    # --- password policy and fine-grained password settings ---
    # Last on purpose: the domain policy applies to every password set after
    # it. The values stay compatible with the fixture password used above.
    - name: Converge | Tighten the domain password policy (history, age, lockout timers)
      jomrr.samba.samba_password_policy:
        settings:
          minimum_length: 8
          history_length: 12
          maximum_age_days: 90
          lockout_duration_minutes: 45
          lockout_window_minutes: 45

    - name: Converge | Create a fine-grained policy for a group and a user
      jomrr.samba.samba_password_settings:
        name: admins_pso
        precedence: 10
        applies_to:
          - engineers
          - jane
        settings:
          minimum_length: 16
          complexity: true
          reversible_encryption: false
        state: present

    - name: Converge | Create a fine-grained policy that inherits every setting from the domain
      jomrr.samba.samba_password_settings:
        name: inherit_pso
        precedence: 20
        state: present

    - name: Converge | Remove a seeded fine-grained policy
      jomrr.samba.samba_password_settings:
        name: todelete_pso
        state: absent

    - name: Converge | Absent on a non-existent fine-grained policy is a no-op
      jomrr.samba.samba_password_settings:
        name: ghost_pso
        state: absent

    # --- schema extensions: local on the schema master (this single DC) ---
    - name: Converge | Extend the schema for Windows LAPS
      jomrr.samba.samba_schema_extension:
        extension: laps

    - name: Converge | Extend the schema for OpenSSH public keys on user accounts
      jomrr.samba.samba_schema_extension:
        extension: sshpublickey

    - name: Converge | Extend the schema for LDAP compatibility (entryUUID)
      jomrr.samba.samba_schema_extension:
        extension: ldapcompat
