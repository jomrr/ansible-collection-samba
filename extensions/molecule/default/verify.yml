---
# Verify the converged state by reading it back through the *_info modules.
# (Idempotence itself is asserted by molecule's second converge run.)
- name: Verify
  hosts: all
  gather_facts: false
  module_defaults:
    group/jomrr.samba.all:
      server: "{{ samba_fqdn }}"
      bind_username: Administrator
      bind_password: "{{ samba_admin_password }}"
      realm: "{{ samba_realm }}"
  tasks:
    - name: Verify | Read the created user
      jomrr.samba.samba_user_info:
        username: jane
      register: _jane

    - name: Verify | The user exists with the expected attributes, enabled
      ansible.builtin.assert:
        that:
          - _jane.users | length == 1
          - _jane.users[0].given_name == "Jane"
          - _jane.users[0].surname == "Doe"
          - _jane.users[0].display_name == "Jane Doe"
          - _jane.users[0].email == "jane.doe@example.com"
          - _jane.users[0].enabled is true

    - name: Verify | Read the user created with names only
      jomrr.samba.samba_user_info:
        username: derived
      register: _derived

    - name: Verify | The display name was derived from the names on the add (as samba-tool does)
      ansible.builtin.assert:
        that:
          - _derived.users | length == 1
          - _derived.users[0].dn | lower is search('^cn=derived,')
          - _derived.users[0].given_name == "Dee"
          - _derived.users[0].surname == "Rived"
          - _derived.users[0].display_name == "Dee Rived"

    - name: Verify | Read the modified user
      jomrr.samba.samba_user_info:
        username: tomodify
      register: _tomodify

    - name: Verify | The attribute change is present
      ansible.builtin.assert:
        that:
          - _tomodify.users[0].display_name == "New Name"

    - name: Verify | Read the multi-attribute user
      jomrr.samba.samba_user_info:
        username: multiattr
      register: _multiattr

    - name: Verify | All of the changed attributes are present
      ansible.builtin.assert:
        that:
          - _multiattr.users[0].given_name == "Multi"
          - _multiattr.users[0].surname == "User"
          - _multiattr.users[0].display_name == "New Multi"
          - _multiattr.users[0].email == "multi.user@example.com"
          - _multiattr.users[0].description == "New multi description"

    - name: Verify | Read the user whose attributes were removed
      jomrr.samba.samba_user_info:
        username: clearattr
      register: _clearattr

    - name: Verify | The removed attributes are gone
      ansible.builtin.assert:
        that:
          - _clearattr.users[0].display_name is none
          - _clearattr.users[0].description is none

    - name: Verify | Read the user whose create was rejected by the password policy
      jomrr.samba.samba_user_info:
        username: weakpw
      register: _weakpw

    - name: Verify | The rejected create left no account behind (all-or-nothing)
      ansible.builtin.assert:
        that:
          - _weakpw.users | length == 0

    - name: Verify | Read the disabled user
      jomrr.samba.samba_user_info:
        username: todisable
      register: _todisable

    - name: Verify | The user is disabled
      ansible.builtin.assert:
        that:
          - _todisable.users[0].enabled is false

    - name: Verify | Read the re-enabled user
      jomrr.samba.samba_user_info:
        username: toenable
      register: _toenable

    - name: Verify | The user is enabled again
      ansible.builtin.assert:
        that:
          - _toenable.users[0].enabled is true

    - name: Verify | Read the disabled user whose attribute was changed
      jomrr.samba.samba_user_info:
        username: staydisabled
      register: _staydisabled

    - name: Verify | The attribute changed and the account stayed disabled
      ansible.builtin.assert:
        that:
          - _staydisabled.users[0].display_name == "New Disabled"
          - _staydisabled.users[0].enabled is false

    - name: Verify | Read the deleted user
      jomrr.samba.samba_user_info:
        username: todelete
      register: _todelete

    - name: Verify | The deleted user is gone
      ansible.builtin.assert:
        that:
          - _todelete.users | length == 0

    - name: Verify | Read the user created with the full POSIX attribute set
      jomrr.samba.samba_user_info:
        username: posixuser
      register: _posixuser

    - name: Verify | All POSIX attributes are present and correctly typed
      ansible.builtin.assert:
        that:
          - _posixuser.users[0].uid_number == 10001
          - _posixuser.users[0].gid_number == 10000
          - _posixuser.users[0].uid_number is integer
          - _posixuser.users[0].unix_home_directory == "/home/posixuser"
          - _posixuser.users[0].login_shell == "/bin/bash"
          - _posixuser.users[0].gecos == "POSIX User"

    - name: Verify | Read the user whose POSIX attributes were changed
      jomrr.samba.samba_user_info:
        username: posixmod
      register: _posixmod

    - name: Verify | The changed POSIX integer and string attributes are present
      ansible.builtin.assert:
        that:
          - _posixmod.users[0].uid_number == 10002
          - _posixmod.users[0].login_shell == "/bin/zsh"

    - name: Verify | Read the created group
      jomrr.samba.samba_group_info:
        name: engineers
      register: _engineers

    - name: Verify | The group has the right type and member
      ansible.builtin.assert:
        that:
          - _engineers.groups | length == 1
          - _engineers.groups[0].scope == "global"
          - _engineers.groups[0].category == "security"
          - _engineers.groups[0].members | length == 1
          - "'jane' in (_engineers.groups[0].members | join(' ') | lower)"

    - name: Verify | Read the group whose POSIX gid was set
      jomrr.samba.samba_group_info:
        name: posixgrp
      register: _posixgrp

    - name: Verify | The group POSIX gid is present and correctly typed
      ansible.builtin.assert:
        that:
          - _posixgrp.groups[0].gid_number == 10000
          - _posixgrp.groups[0].gid_number is integer

    - name: Verify | Read the group created with a POSIX gid directly in an OU
      jomrr.samba.samba_group_info:
        name: posixnew
      register: _posixnew

    - name: Verify | The gid and the placement came with the single add
      ansible.builtin.assert:
        that:
          - _posixnew.groups | length == 1
          - _posixnew.groups[0].gid_number == 10001
          - _posixnew.groups[0].dn | lower is search('ou=loc_a')

    - name: Verify | Read the group whose members did not exist
      jomrr.samba.samba_group_info:
        name: badmembers
      register: _badmembers

    - name: Verify | The rejected member list left no group behind (resolved before any write)
      ansible.builtin.assert:
        that:
          - _badmembers.groups | length == 0

    - name: Verify | Read the purged group
      jomrr.samba.samba_group_info:
        name: crew
      register: _crew

    - name: Verify | Authoritative purge removed the other two members
      ansible.builtin.assert:
        that:
          - _crew.groups[0].members | length == 1
          - "'tomodify' in (_crew.groups[0].members | join(' ') | lower)"
          - "'extrauser' not in (_crew.groups[0].members | join(' ') | lower)"
          - "'toenable' not in (_crew.groups[0].members | join(' ') | lower)"

    - name: Verify | Read the additive-membership group
      jomrr.samba.samba_group_info:
        name: addmembers
      register: _addmembers

    - name: Verify | The pre-existing and the added member are both present
      ansible.builtin.assert:
        that:
          - _addmembers.groups[0].members | length == 2
          - "'extrauser' in (_addmembers.groups[0].members | join(' ') | lower)"
          - "'jane' in (_addmembers.groups[0].members | join(' ') | lower)"

    - name: Verify | Read the built-in group whose description was updated
      jomrr.samba.samba_group_info:
        name: DnsAdmins
      register: _dnsadmins

    - name: Verify | The built-in group kept its domain-local security type
      ansible.builtin.assert:
        that:
          - _dnsadmins.groups[0].description == "Managed by molecule"
          - _dnsadmins.groups[0].scope == "domain_local"
          - _dnsadmins.groups[0].category == "security"

    - name: Verify | Read the scope-changed group
      jomrr.samba.samba_group_info:
        name: scopechange
      register: _scopechange

    - name: Verify | The group scope is now universal
      ansible.builtin.assert:
        that:
          - _scopechange.groups[0].scope == "universal"
          - _scopechange.groups[0].category == "security"

    - name: Verify | Read the group created with a member in an OU
      jomrr.samba.samba_group_info:
        name: gstaff
      register: _gstaff

    - name: Verify | The group sits in the OU and has its member
      ansible.builtin.assert:
        that:
          - _gstaff.groups[0].dn | lower is search('ou=loc_a')
          - "'jane' in (_gstaff.groups[0].members | join(' ') | lower)"

    - name: Verify | Read the top-level OU
      jomrr.samba.samba_ou_info:
        name: department
        path: "{{ samba_base_dn }}"
      register: _department

    - name: Verify | Read the second-level OU
      jomrr.samba.samba_ou_info:
        name: team
        path: "OU=department,{{ samba_base_dn }}"
      register: _team

    - name: Verify | Read the third-level OU
      jomrr.samba.samba_ou_info:
        name: squad
        path: "OU=team,OU=department,{{ samba_base_dn }}"
      register: _squad

    - name: Verify | Read the deleted OU
      jomrr.samba.samba_ou_info:
        name: todelete_ou
        path: "{{ samba_base_dn }}"
      register: _todelete_ou

    - name: Verify | Read the nested OU whose description changed
      jomrr.samba.samba_ou_info:
        name: submod
        path: "OU=loc_a,{{ samba_base_dn }}"
      register: _submod

    - name: Verify | The 3-level hierarchy exists, the deleted OU is gone, the nested description changed
      ansible.builtin.assert:
        that:
          - _department.ous | length == 1
          - _team.ous | length == 1
          - _team.ous[0].dn | lower is search('ou=team,ou=department')
          - _squad.ous | length == 1
          - _squad.ous[0].dn | lower is search('ou=squad,ou=team,ou=department')
          - _todelete_ou.ous | length == 0
          - _submod.ous[0].description == "New nested description"

    - name: Verify | List all OUs in the domain (no name)
      jomrr.samba.samba_ou_info:
      register: _all_ous

    - name: Verify | The created OUs appear in the full listing
      ansible.builtin.assert:
        that:
          - "'department' in (_all_ous.ous | map(attribute='name') | list)"
          - "'squad' in (_all_ous.ous | map(attribute='name') | list)"

    - name: Verify | Read the user placed in / moved between OUs
      jomrr.samba.samba_user_info:
        username: placed
      register: _placed

    - name: Verify | Read the moved user
      jomrr.samba.samba_user_info:
        username: mover
      register: _mover

    - name: Verify | The users sit under the expected OUs
      ansible.builtin.assert:
        that:
          - _placed.users[0].dn | lower is search('ou=loc_a')
          - _mover.users[0].dn | lower is search('ou=loc_b')

    - name: Verify | Read the group placed in / moved between OUs
      jomrr.samba.samba_group_info:
        name: gplaced
      register: _gplaced

    - name: Verify | Read the moved group
      jomrr.samba.samba_group_info:
        name: gmover
      register: _gmover

    - name: Verify | The groups sit under the expected OUs
      ansible.builtin.assert:
        that:
          - _gplaced.groups[0].dn | lower is search('ou=loc_a')
          - _gmover.groups[0].dn | lower is search('ou=loc_b')

    - name: Verify | Read the group whose description was removed
      jomrr.samba.samba_group_info:
        name: gclear
      register: _gclear

    - name: Verify | Read the OU whose description was removed
      jomrr.samba.samba_ou_info:
        name: ouclear
        path: "{{ samba_base_dn }}"
      register: _ouclear

    - name: Verify | The removed descriptions are gone
      ansible.builtin.assert:
        that:
          - _gclear.groups[0].description is none
          - _ouclear.ous[0].description is none

    # DNS records are read back through samba_dns_record_info (the read mirror of
    # samba_dns_record, same local-SamDB path). Values are asserted in the DC's
    # stored/normalized form: AAAA fully expanded; CNAME/PTR/NS and the MX/SRV
    # target compared trailing-dot-insensitively.
    - name: Verify | Read back each created DNS record
      jomrr.samba.samba_dns_record_info:
        zone: "{{ samba_dns_zone }}"
        name: "{{ item.name }}"
        type: "{{ item.type }}"
      register: _dnsinfo
      loop:
        - {name: www, type: A, value: "192.0.2.10"}
        - {name: www, type: AAAA, value: "2001:0db8:0000:0000:0000:0000:0000:0010"}
        - {name: ftp, type: CNAME, value: "www.{{ samba_dns_zone }}"}
        - {name: "@", type: MX, value: "mail.{{ samba_dns_zone }}", preference: 10}
        - {name: "@", type: TXT, value: "v=spf1 -all"}
        - {name: _sip._tcp, type: SRV, value: "sip.{{ samba_dns_zone }}", priority: 0, weight: 100, port: 5060}
        - {name: ptrtest, type: PTR, value: "host.{{ samba_dns_zone }}"}
        - {name: deleg, type: NS, value: "ns1.{{ samba_dns_zone }}"}
      loop_control:
        label: "{{ item.name }} {{ item.type }}"

    - name: Verify | Each record is present with the expected normalized data
      ansible.builtin.assert:
        that:
          - item.records | length == 1
          - item.records[0].value | regex_replace('\.$', '') == item.item.value
          - item.item.preference is not defined or item.records[0].preference == item.item.preference
          - item.item.priority is not defined or item.records[0].priority == item.item.priority
          - item.item.weight is not defined or item.records[0].weight == item.item.weight
          - item.item.port is not defined or item.records[0].port == item.item.port
      loop: "{{ _dnsinfo.results }}"
      loop_control:
        label: "{{ item.item.name }} {{ item.item.type }}"

    - name: Verify | Read back the name whose record was removed and re-created
      jomrr.samba.samba_dns_record_info:
        zone: "{{ samba_dns_zone }}"
        name: dnsdel
        type: A
      register: _dns_recreated

    - name: Verify | Only the re-created record is present (the removed one is gone)
      ansible.builtin.assert:
        that:
          - _dns_recreated.records | map(attribute='value') | list == ["192.0.2.98"]

    - name: Verify | Resolve the re-created name through the DNS server
      # The resolver points at the local samba DNS (prepare.yml). Had the node
      # stayed tombstoned after the removal, the server would answer NXDOMAIN
      # (getent rc 2) although the record is stored.
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "dnsdel.{{ samba_dns_zone }}"
      register: _dns_resolved
      changed_when: false

    - name: Verify | The re-created record resolves to its new address
      ansible.builtin.assert:
        that:
          - _dns_resolved.stdout is match('192\.0\.2\.98\s')

    - name: Verify | Read the record whose TTL was changed
      jomrr.samba.samba_dns_record_info:
        zone: "{{ samba_dns_zone }}"
        name: dnsttl
        type: A
      register: _dns_ttl

    - name: Verify | The TTL was reconciled in place (one record, new TTL)
      ansible.builtin.assert:
        that:
          - _dns_ttl.records | map(attribute='value') | list == ["192.0.2.96"]
          - _dns_ttl.records[0].ttl == 600

    - name: Verify | Resolve the name samba-tool had deleted (revived tombstoned node)
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "dnsrevive.{{ samba_dns_zone }}"
      register: _dns_revived
      changed_when: false

    - name: Verify | The revived name resolves
      ansible.builtin.assert:
        that:
          - _dns_revived.stdout is match('192\.0\.2\.97\s')

    - name: Verify | Read the SOA serial baseline recorded after seeding
      ansible.builtin.command:
        argv:
          - cat
          - /var/lib/samba/soa-serial-baseline
      register: _soa_baseline
      changed_when: false

    - name: Verify | Query the current SOA serial through the DNS RPC
      ansible.builtin.command:
        argv:
          - samba-tool
          - dns
          - query
          - "{{ samba_fqdn }}"
          - "{{ samba_dns_zone }}"
          - "@"
          - SOA
          - "--username=Administrator"
      environment:
        PASSWD: "{{ samba_admin_password }}"
      register: _soa_now
      changed_when: false

    - name: Verify | The record changes raised the zone serial (secondaries would refresh)
      ansible.builtin.assert:
        that:
          - (_soa_now.stdout | regex_search('serial=([0-9]+)', '\\1') | first | int) > (_soa_baseline.stdout | trim | int)

    # Zones are read back through samba_dns_zone_info (the LDB read mirror of
    # samba_dns_zone), the same pattern as the other modules - replacing the
    # earlier samba-tool dns zonelist probe.
    - name: Verify | List the DNS zones through samba_dns_zone_info
      jomrr.samba.samba_dns_zone_info:
      register: _zones

    - name: Verify | Read the forest-replicated zone on its own
      jomrr.samba.samba_dns_zone_info:
        name: zforest.example.com
      register: _zforest

    - name: Verify | The created zones exist with the right scope and the deleted one is gone
      vars:
        _zone_names: "{{ _zones.zones | map(attribute='name') | list }}"
      ansible.builtin.assert:
        that:
          - "'ztest.example.com' in _zone_names"
          - "'2.0.192.in-addr.arpa' in _zone_names"
          - "'zforest.example.com' in _zone_names"
          - "'zdelete.example.com' not in _zone_names"
          # Scope is derived from the partition, reverse from the name.
          - _zforest.zones | length == 1
          - _zforest.zones[0].replication == "forest"
          - (_zones.zones | selectattr('name', 'equalto', 'ztest.example.com') | first).replication == "domain"
          - (_zones.zones | selectattr('name', 'equalto', '2.0.192.in-addr.arpa') | first).reverse is true

    # The GSSAPI ticket lives in a MEMORY ccache and never on disk. Clear any
    # stray cache, run a module (which performs a GSSAPI bind), then assert no
    # krb5 credential cache file was left behind.
    - name: Verify | Clear any stray Kerberos credential caches
      ansible.builtin.command:
        cmd: find /tmp /run /var/tmp -name 'krb5cc*' -delete
      changed_when: false

    - name: Verify | Perform a module GSSAPI bind
      jomrr.samba.samba_user_info:
        username: jane
      register: _leak_probe

    - name: Verify | No Kerberos credential cache was written to disk
      ansible.builtin.find:
        paths: [/tmp, /run, /var/tmp]
        patterns: "krb5cc*"
        recurse: true
      register: _ccache_files

    - name: Verify | Assert the ticket stayed in memory (no on-disk ccache)
      ansible.builtin.assert:
        that:
          - _leak_probe.users | length == 1
          - _ccache_files.files | length == 0
