---
# Main workflow: the full validation. Runs on push to main and on pull requests
# targeting main (e.g. the dev->main release PR). The fast gates (via the
# reusable test.yml) run on both; the Molecule integration matrix runs only on
# push, and only when the push changed something the scenarios can see (the
# `changes` job below), so a release commit (galaxy.yml only) or a changelog
# fragment does not pay for five four-distro DC runs. Pushes that touch only
# files no gate reads (paths-ignore, the same list as in dev.yml) start no run
# at all, and therefore no docs deploy either (docs.yml follows this
# workflow's success). Release tags get no run of their own: PSR tags the
# release commit on main once this workflow was green for the promote, and
# the push of that commit runs the fast gates.
name: main

"on":
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.rst"
      - "Makefile"
      - "pyproject.toml"
      - "architecture/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.rst"
      - "Makefile"
      - "pyproject.toml"
      - "architecture/**"

jobs:
  # Reuse the exact same sanity/units/lint definition as the dev workflow.
  test:
    uses: ./.github/workflows/test.yml

  # Did the push change anything the Molecule scenarios can see? Compares the
  # state before the push with the pushed commit, so a promote (many commits)
  # is judged as a whole. Skipped on pull requests, which skips Molecule too.
  changes:
    name: Classify the changed files
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - name: Check out the collection with its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Look for integration-relevant changes in the push
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # No usable "before" (first push, or its history was rewritten): run everything.
          if ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff --quiet exits 1 when any of these paths changed in the push.
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- \
              plugins meta/runtime.yml extensions/molecule tests/integration .github/workflows/main.yml; then
            echo "integration=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration=true" >> "$GITHUB_OUTPUT"
          fi

  molecule:
    name: Molecule (${{ matrix.scenario }}, four-distro matrix)
    needs: [test, changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # default = the object-module suite; provision = the samba_provision
      # scenario; join_dc = the multi-host samba_join_dc scenario (DC+joiner
      # pairs, eight containers). Separate matrix jobs so a failure is
      # unambiguously attributable. The join_dc job needs no extra setup: the
      # podman driver auto-creates the shared network the pairs use, and the
      # inotify limits raised below already give the larger container count
      # headroom.
      matrix:
        scenario:
          - default
          - provision
          - join_dc
          - join_member
          - join_sssd
    env:
      # Resolve both the collection under test (checked out below) and the
      # containers.podman collection the Molecule podman driver needs, from one
      # path. ansible-test layout requires ansible_collections/<ns>/<name>.
      COLLECTION_PATH: ansible_collections/jomrr/samba
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v5
        with:
          path: ansible_collections/jomrr/samba

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Raise inotify limits for the multi-DC container run
        # The four DCs run Samba as a plain daemon (not systemd-PID1), so their
        # inotify footprint is modest, but raise the limits to give the matrix
        # headroom on a shared runner kernel.
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Show the container engine
        run: podman version

      - name: Install Molecule, ansible-core and the Podman driver
        run: >-
          python -m pip install --disable-pip-version-check
          "ansible-core>=2.19" molecule "molecule-plugins[podman]"

      - name: Install the integration-test collection dependencies
        # community.general (the zypper module for the openSUSE hosts) and
        # containers.podman (the podman_* modules Molecule's create/destroy use).
        # Test-only collection deps, kept out of galaxy.yml; installed beside the
        # collection for ANSIBLE_COLLECTIONS_PATH.
        run: >-
          ansible-galaxy collection install
          -r "${{ env.COLLECTION_PATH }}/tests/integration/requirements.yml"
          -p "${{ github.workspace }}"

      - name: Run Molecule (${{ matrix.scenario }}, all four distros)
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: ${{ env.COLLECTION_PATH }}
